<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&display=swap">
<link rel="stylesheet" href="style.css">
<title>DoneQuest — Profil</title>
</head>
<body data-page="profil">
<nav id="nav"></nav>
<main>
  <section class="card full profile-head">
    <div class="avatar lg">NP</div>
    <div style="flex:1 1 260px"><h1>@namapengguna</h1><p class="mut" style="margin-top:4px">Level 12 — Explorer · Total 2.840 XP</p></div>
    <div><div class="mut">Streak saat ini</div><div class="big">7 hari</div></div>
  </section>
  <div class="stats">
    <div class="card"><div class="mut">Quest selesai</div><div class="big">128</div></div>
    <div class="card"><div class="mut">XP minggu ini</div><div class="big">940</div></div>
    <div class="card"><div class="mut">Tingkat penyelesaian</div><div class="big">82%</div></div>
    <div class="card"><div class="mut">Streak terpanjang</div><div class="big">12 hari</div></div>
  </div>
  <section class="card full"><h2>XP per hari (7 hari terakhir)</h2><div class="chart" id="chart"></div></section>
  <section class="card full"><h2>Koleksi achievement</h2><div class="ach-grid" id="ach-list"></div></section>
</main>
<script src="script.js"></script>
</body>
</html>
