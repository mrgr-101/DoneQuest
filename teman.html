<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link href="./src/output.css" rel="stylesheet" />
  <title>Teman - DoneQuest</title>
</head>
<body class="min-h-screen bg-[#0f111a] text-[#e8e9ee]">
  <nav class="flex items-center gap-8 overflow-x-auto border-b border-[#23273a] px-6 lg:px-12">
    <a href="index.html" class="py-6 text-2xl font-bold text-[#f5b83d]">DoneQuest</a>
    <a href="#" class="py-6 text-[#a3a7b8]">Dashboard</a>
    <a href="#" class="whitespace-nowrap py-6 text-[#a3a7b8]">Quest Saya</a>
    <a href="#" class="py-6 text-[#a3a7b8]">Leaderboard</a>
    <a href="teman.html" class="border-b-2 border-[#f5b83d] py-6 text-white">Teman</a>
    <a href="#" class="py-6 text-[#a3a7b8]">Profil</a>
  </nav>

  <main class="grid grid-cols-1 items-start gap-6 px-6 py-10 lg:grid-cols-5 lg:px-12">
    <section class="rounded-2xl border border-[#23273a] bg-[#1a1d2b] p-7 lg:col-span-3">
      <div class="flex items-baseline justify-between">
        <h1 class="text-3xl font-bold text-white">Daftar Teman</h1>
        <span id="jumlah-teman" class="text-[#a3a7b8]"></span>
      </div>
      <input id="cari" oninput="tampil()" placeholder="Cari di daftar teman" class="mt-6 w-full rounded-xl border border-[#2f3448] bg-[#141726] px-5 py-4 text-white placeholder:text-[#8a8ea0] focus:border-[#f5b83d] focus:outline-none" />
      <ul id="daftar-teman" class="mt-6 space-y-3"></ul>
    </section>

    <div class="space-y-6 lg:col-span-2">
      <section class="rounded-2xl border border-[#23273a] bg-[#1a1d2b] p-6">
        <h2 class="text-lg font-bold text-white">Tambah teman</h2>
        <label for="username" class="mt-4 block text-sm text-[#a3a7b8]">Username</label>
        <div class="mt-2 flex gap-3">
          <input id="username" placeholder="Cari username" class="min-w-0 flex-1 rounded-xl border border-[#2f3448] bg-[#141726] px-5 py-3.5 text-white placeholder:text-[#8a8ea0] focus:border-[#f5b83d] focus:outline-none" />
          <button onclick="kirim()" class="cursor-pointer rounded-xl bg-[#f5b83d] px-8 font-bold text-[#1a1d2b]">Kirim</button>
        </div>
        <p id="pesan" class="mt-3 text-sm text-[#a3a7b8]"></p>
      </section>

      <section class="rounded-2xl border border-[#23273a] bg-[#1a1d2b] p-6">
        <h2 id="judul-permintaan" class="text-lg font-bold text-white"></h2>
        <ul id="daftar-permintaan" class="mt-4 space-y-3"></ul>
      </section>
    </div>
  </main>

  <script>
    let teman = [
      { nama: "user_empat", inisial: "BT", info: "Level 14 — Explorer · Streak 5 hari", xp: "342.000 XP" },
      { nama: "user_lima", inisial: "RS", info: "Level 12 — Explorer · Streak 3 hari", xp: "210.000 XP" },
      { nama: "user_enam", inisial: "LF", info: "Level 8 — Adventurer · Streak 2 hari", xp: "1.905 XP" },
      { nama: "user_tujuh", inisial: "MH", info: "Level 7 — Adventurer · Streak 9 hari", xp: "112.000 XP" },
      { nama: "user_delapan", inisial: "DP", info: "Level 5 — Newbie · Streak 1 hari", xp: "6.400 XP" },
      { nama: "user_sembilan", inisial: "ZK", info: "Level 3 — Newbie · Streak 0 hari", xp: "310 XP" }
    ];
    let permintaan = [
      { nama: "Daffa", inisial: "DF" },
      { nama: "Randa", inisial: "RD" }
    ];

    function tampil() {
      const kata = document.getElementById("cari").value.toLowerCase();
      let daftar = "";
      for (const t of teman) {
        if (t.nama.toLowerCase().includes(kata)) {
          daftar += `<li class="flex items-center gap-4 rounded-xl border border-[#23273a] bg-[#151826] px-6 py-5">
            <div class="flex h-14 w-14 shrink-0 items-center justify-center rounded-full bg-[#2a2e44] text-sm font-bold">${t.inisial}</div>
            <div class="flex-1"><p class="font-bold text-white">@${t.nama}</p><p class="text-sm text-[#a3a7b8]">${t.info}</p></div>
            <div class="text-right"><p class="font-bold text-[#f5b83d]">${t.xp}</p><a href="#" class="text-sm text-[#f5b83d]">Lihat profil</a><button onclick="hapus('${t.nama}')" class="ml-3 cursor-pointer text-sm text-[#a3a7b8]">Hapus</button></div>
          </li>`;
        }
      }
      let masuk = "";
      for (const p of permintaan) {
        masuk += `<li>
          <div class="flex items-center gap-3"><div class="flex h-12 w-12 shrink-0 items-center justify-center rounded-full bg-[#2a2e44] text-sm font-bold">${p.inisial}</div><div><p class="text-white">@${p.nama}</p><p class="text-sm text-[#a3a7b8]">Menunggu respons</p></div></div>
          <div class="mt-3 flex gap-3">
            <button onclick="terima('${p.nama}')" class="cursor-pointer rounded-xl bg-[#f5b83d] px-9 py-3.5 font-bold text-[#1a1d2b]">Terima</button>
            <button onclick="tolak('${p.nama}')" class="cursor-pointer rounded-xl border border-[#2f3448] px-9 py-3.5 text-white">Tolak</button>
          </div>
        </li>`;
      }
      document.getElementById("daftar-teman").innerHTML = daftar;
      document.getElementById("daftar-permintaan").innerHTML = masuk;
      document.getElementById("jumlah-teman").textContent = teman.length + " teman";
      document.getElementById("judul-permintaan").textContent = "Permintaan pertemanan (" + permintaan.length + ")";
    }

    function hapus(nama) {
      if (confirm("Hapus teman ini?")) {
        teman = teman.filter((t) => t.nama !== nama);
        tampil();
      }
    }

    function tolak(nama) {
      permintaan = permintaan.filter((p) => p.nama !== nama);
      tampil();
    }

    function terima(nama) {
      const p = permintaan.find((p) => p.nama === nama);
      teman.push({ nama: nama, inisial: p.inisial, info: "Level 1 — Newbie · Streak 0 hari", xp: "0 XP" });
      tolak(nama);
    }

    function kirim() {
      const input = document.getElementById("username");
      const nama = input.value.trim();
      document.getElementById("pesan").textContent = nama === "" ? "Isi username dulu." : "Permintaan dikirim ke " + nama + ".";
      input.value = "";
    }

    tampil();
  </script>
</body>
</html>
