<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <title>DoneQuest — Teman</title>
</head>
<body class="min-h-screen bg-[#0b0f19] text-gray-200 font-['Inter']">

  <!-- Header / Navigasi (Sama Persis dengan Dashboard) -->
  <header class="border-b border-gray-800/60 bg-[#0f1523]/80 backdrop-blur sticky top-0 z-40">
    <div class="max-w-7xl mx-auto px-6 h-16 flex items-center justify-between">
      <div class="flex items-center space-x-12">
        <a href="index.html" class="text-xl font-bold tracking-tight text-amber-500 hover:text-amber-400 transition-colors">DoneQuest</a>
        <nav class="hidden md:flex items-center gap-8 text-sm font-semibold">
          <a href="index.html" class="text-gray-400 hover:text-gray-200 transition-colors py-5 border-b-2 border-transparent">Dashboard</a>
          <a href="quest.html" class="text-gray-400 hover:text-gray-200 transition-colors py-5 border-b-2 border-transparent">Quest Saya</a>
          <a href="leaderboard.html" class="text-gray-400 hover:text-gray-200 transition-colors py-5 border-b-2 border-transparent">Leaderboard</a>
          <a href="teman.html" class="text-white relative py-5 border-b-2 border-amber-500">Teman</a>
          <a href="profil.html" class="text-gray-400 hover:text-gray-200 transition-colors py-5 border-b-2 border-transparent">Profil</a>
        </nav>
      </div>
      <button id="mobileMenuBtn" class="md:hidden text-gray-300 text-2xl" aria-label="Buka menu">☰</button>
    </div>
    <nav id="mobileMenu" class="hidden md:hidden bg-[#131b2e] border-b border-gray-800 px-6 py-4 space-y-3">
      <a class="block text-gray-400" href="index.html">Dashboard</a>
      <a class="block text-gray-400" href="quest.html">Quest Saya</a>
      <a class="block text-gray-400" href="leaderboard.html">Leaderboard</a>
      <a class="block text-amber-400 font-medium" href="teman.html">Teman</a>
      <a class="block text-gray-400" href="profil.html">Profil</a>
    </nav>
  </header>

  <!-- Main Content -->
  <main class="max-w-7xl mx-auto px-6 py-10 grid grid-cols-1 lg:grid-cols-5 gap-6 items-start">
    
    <!-- Kolom Kiri: Daftar Teman (3 Kolom) -->
    <section class="lg:col-span-3 bg-[#192338] border border-gray-800/60 rounded-xl p-6 sm:p-7">
      <div class="flex items-baseline justify-between border-b border-gray-800/60 pb-4">
        <h1 class="text-xl sm:text-2xl font-bold text-gray-100">Daftar Teman</h1>
        <span id="jumlah-teman" class="text-sm text-gray-400">0 teman</span>
      </div>
      <input id="cari" oninput="tampilTeman()" placeholder="Cari di daftar teman..." class="mt-6 w-full rounded-xl border border-gray-800 bg-[#0f1523] px-4 py-3 text-sm text-gray-200 placeholder:text-gray-500 focus:border-amber-500 focus:outline-none transition-colors" />
      <ul id="daftar-teman" class="mt-6 space-y-3"></ul>
    </section>

    <!-- Kolom Kanan: Sidebar Tambah & Permintaan (2 Kolom) -->
    <div class="lg:col-span-2 space-y-6">
      
      <!-- Card Tambah Teman -->
      <section class="bg-[#192338] border border-gray-800/60 rounded-xl p-6">
        <h2 class="text-base font-bold text-gray-100">Tambah Teman</h2>
        <label for="username" class="mt-4 block text-xs text-gray-400">Username</label>
        <div class="mt-2 flex gap-3">
          <input id="username" placeholder="Cari username..." class="min-w-0 flex-1 rounded-xl border border-gray-800 bg-[#0f1523] px-4 py-2.5 text-sm text-gray-200 placeholder:text-gray-500 focus:border-amber-500 focus:outline-none transition-colors" />
          <button onclick="kirim()" class="cursor-pointer rounded-xl bg-amber-500 hover:bg-amber-400 px-6 text-sm font-bold text-[#0b0f19] transition-colors">Kirim</button>
        </div>
        <p id="pesan" class="mt-3 text-xs font-medium"></p>
      </section>

      <!-- Card Permintaan Pertemanan -->
      <section class="bg-[#192338] border border-gray-800/60 rounded-xl p-6">
        <h2 id="judul-permintaan" class="text-base font-bold text-gray-100">Permintaan Pertemanan</h2>
        <ul id="daftar-permintaan" class="mt-4 space-y-3"></ul>
      </section>

    </div>
  </main>

  <script>
    (() => {
      const INITIAL_FRIENDS = [
        { nama: "user_empat", inisial: "BT", info: "Level 14 — Explorer · Streak 5 hari", xp: "342.000 XP" },
        { nama: "user_lima", inisial: "RS", info: "Level 12 — Explorer · Streak 3 hari", xp: "210.000 XP" },
        { nama: "user_enam", inisial: "LF", info: "Level 8 — Adventurer · Streak 2 hari", xp: "1.905 XP" },
        { nama: "user_tujuh", inisial: "MH", info: "Level 7 — Adventurer · Streak 9 hari", xp: "112.000 XP" },
        { nama: "user_delapan", inisial: "DP", info: "Level 5 — Newbie · Streak 1 hari", xp: "6.400 XP" },
        { nama: "user_sembilan", inisial: "ZK", info: "Level 3 — Newbie · Streak 0 hari", xp: "310 XP" }
      ];

      const INITIAL_REQUESTS = [
        { nama: "Daffa", inisial: "DF" },
        { nama: "Randa", inisial: "RD" }
      ];

      let teman = JSON.parse(localStorage.getItem("donequest_friends")) || INITIAL_FRIENDS;
      let permintaan = JSON.parse(localStorage.getItem("donequest_requests")) || INITIAL_REQUESTS;

      function saveState() {
        localStorage.setItem("donequest_friends", JSON.stringify(teman));
        localStorage.setItem("donequest_requests", JSON.stringify(permintaan));
      }

      function safeText(str) {
        return String(str).replace(/[&<>"']/g, ch => ({
          "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
        }[ch]));
      }

      window.tampilTeman = function() {
        const kata = document.getElementById("cari").value.toLowerCase();
        let daftar = "";
        
        const filtered = teman.filter(t => t.nama.toLowerCase().includes(kata));
        
        if (filtered.length === 0) {
          daftar = `<li class="p-6 text-center text-xs text-gray-400 border border-dashed border-gray-800 rounded-xl">Teman tidak ditemukan.</li>`;
        } else {
          for (const t of filtered) {
            daftar += `
              <li class="flex items-center gap-4 rounded-xl border border-gray-800/60 bg-[#0f1523] px-5 py-4">
                <div class="flex h-12 w-12 shrink-0 items-center justify-center rounded-full bg-[#1e2b45] text-xs font-bold text-amber-500">${safeText(t.inisial)}</div>
                <div class="flex-1 min-w-0">
                  <p class="font-semibold text-sm text-gray-200 truncate">@${safeText(t.nama)}</p>
                  <p class="text-xs text-gray-400 truncate mt-0.5">${safeText(t.info)}</p>
                </div>
                <div class="text-right shrink-0">
                  <p class="font-bold text-sm text-amber-500">${safeText(t.xp)}</p>
                  <div class="mt-1 flex items-center justify-end gap-3 text-xs">
                    <a href="#" class="text-amber-500 hover:underline">Profil</a>
                    <button onclick="hapus('${safeText(t.nama)}')" class="cursor-pointer text-gray-400 hover:text-red-400 transition-colors">Hapus</button>
                  </div>
                </div>
              </li>`;
          }
        }
        
        document.getElementById("daftar-teman").innerHTML = daftar;
        document.getElementById("jumlah-teman").textContent = teman.length + " teman";
      };

      function tampilPermintaan() {
        let masuk = "";
        if (permintaan.length === 0) {
          masuk = `<li class="p-4 text-center text-xs text-gray-400 border border-dashed border-gray-800 rounded-xl">Tidak ada permintaan pertemanan.</li>`;
        } else {
          for (const p of permintaan) {
            masuk += `
              <li class="rounded-xl border border-gray-800/60 bg-[#0f1523] p-4">
                <div class="flex items-center gap-3">
                  <div class="flex h-10 w-10 shrink-0 items-center justify-center rounded-full bg-[#1e2b45] text-xs font-bold text-amber-500">${safeText(p.inisial)}</div>
                  <div class="min-w-0">
                    <p class="text-sm font-semibold text-gray-200 truncate">@${safeText(p.nama)}</p>
                    <p class="text-xs text-gray-400 mt-0.5">Menunggu respons</p>
                  </div>
                </div>
                <div class="mt-3 flex gap-2">
                  <button onclick="terima('${safeText(p.nama)}')" class="flex-1 cursor-pointer rounded-xl bg-amber-500 hover:bg-amber-400 py-2 text-center text-xs font-bold text-[#0b0f19] transition-colors">Terima</button>
                  <button onclick="tolak('${safeText(p.nama)}')" class="flex-1 cursor-pointer rounded-xl border border-gray-800 hover:bg-gray-800/50 py-2 text-center text-xs font-semibold text-gray-300 transition-colors">Tolak</button>
                </div>
              </li>`;
          }
        }
        document.getElementById("daftar-permintaan").innerHTML = masuk;
        document.getElementById("judul-permintaan").textContent = "Permintaan Pertemanan (" + permintaan.length + ")";
      }

      window.hapus = function(nama) {
        if (confirm(`Hapus @${nama} dari daftar teman?`)) {
          teman = teman.filter(t => t.nama !== nama);
          saveState();
          tampilTeman();
        }
      };

      window.tolak = function(nama) {
        permintaan = permintaan.filter(p => p.nama !== nama);
        saveState();
        tampilPermintaan();
      };

      window.terima = function(nama) {
        const p = permintaan.find(item => item.nama === nama);
        if (p) {
          teman.unshift({
            nama: p.nama,
            inisial: p.inisial,
            info: "Level 1 — Newbie · Streak 0 hari",
            xp: "0 XP"
          });
          tolak(nama);
          saveState();
          tampilTeman();
        }
      };

      window.kirim = function() {
        const input = document.getElementById("username");
        const pesan = document.getElementById("pesan");
        const nama = input.value.trim();

        if (!nama) {
          pesan.className = "mt-3 text-xs font-medium text-red-400";
          pesan.textContent = "Isi username terlebih dahulu.";
          return;
        }

        pesan.className = "mt-3 text-xs font-medium text-emerald-400";
        pesan.textContent = "Permintaan dikirim ke @" + nama + ".";
        input.value = "";
      };

      const mobileBtn = document.getElementById("mobileMenuBtn");
      const mobileMenu = document.getElementById("mobileMenu");
      if (mobileBtn && mobileMenu) {
        mobileBtn.addEventListener("click", () => mobileMenu.classList.toggle("hidden"));
      }

      tampilTeman();
      tampilPermintaan();
    })();
  </script>
</body>
</html>
